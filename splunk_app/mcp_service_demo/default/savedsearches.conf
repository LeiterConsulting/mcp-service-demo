[MCP Demo - Active scenario run]
description = Identifies the newest deterministic scenario published by the demo loader.
search = `mcp_demo_base` earliest=-7d | stats max(_time) as latest count as events by demo_run_id | sort 0 - latest | head 1 | convert ctime(latest)
dispatch.earliest_time = -7d
dispatch.latest_time = now
displayview = flashtimeline

[MCP Demo - Checkout health]
description = Calculates health metrics for checkout-api in the active demo run.
search = `mcp_demo_base` `mcp_demo_active_run` service=checkout-api event_type=request earliest=-30m | stats count as requests count(eval(tonumber(status_code)>=500)) as errors perc50(duration_ms) as p50_ms perc95(duration_ms) as p95_ms | eval error_rate_pct=round(errors*100/requests,1)
dispatch.earliest_time = -30m
dispatch.latest_time = now
displayview = flashtimeline

[MCP Demo - Error pattern]
description = Shows the errors the guided agent is expected to find.
search = `mcp_demo_base` `mcp_demo_active_run` service=checkout-api earliest=-30m level=ERROR | stats count values(status_code) as status_codes values(version) as versions by message | sort 0 - count
dispatch.earliest_time = -30m
dispatch.latest_time = now
displayview = flashtimeline

[MCP Demo - Trace explorer]
description = Follows seeded hot traces across checkout-api and inventory-api.
search = `mcp_demo_base` `mcp_demo_active_run` trace_id=tr-hot-* earliest=-30m | sort _time | table _time trace_id service level event_type message status_code duration_ms host version
dispatch.earliest_time = -30m
dispatch.latest_time = now
displayview = flashtimeline
