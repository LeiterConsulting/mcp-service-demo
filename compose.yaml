services:
  demo:
    build: .
    ports:
      - "8100:8100"
      - "8101:8101"
      - "8102:8102"
      - "8103:8103"
    environment:
      AGENT_MODE: ${AGENT_MODE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-1}
      OPENAI_MAX_ITERATIONS: ${OPENAI_MAX_ITERATIONS:-8}
      OPENAI_MAX_TOOL_CALLS: ${OPENAI_MAX_TOOL_CALLS:-12}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-2000}
      OPENAI_MAX_PARALLEL_TOOLS: ${OPENAI_MAX_PARALLEL_TOOLS:-3}
      SPLUNK_MCP_URL: http://127.0.0.1:8101/mcp
      TICKET_MCP_URL: http://127.0.0.1:8102/mcp
      CATALOG_MCP_URL: http://127.0.0.1:8103/mcp
      SPLUNK_DATA_MODE: ${SPLUNK_DATA_MODE:-fixture}
      SPLUNK_REST_URL: ${SPLUNK_REST_URL:-https://127.0.0.1:8089}
      SPLUNK_REST_TOKEN: ${SPLUNK_REST_TOKEN:-}
      SPLUNK_REST_TOKEN_SCHEME: ${SPLUNK_REST_TOKEN_SCHEME:-Bearer}
      SPLUNK_USERNAME: ${SPLUNK_USERNAME:-}
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-}
      SPLUNK_HEC_URL: ${SPLUNK_HEC_URL:-}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-}
      SPLUNK_APP: ${SPLUNK_APP:-mcp_service_demo}
      SPLUNK_OWNER: ${SPLUNK_OWNER:-nobody}
      SPLUNK_INDEX: ${SPLUNK_INDEX:-mcp_demo}
      SPLUNK_SOURCETYPE: ${SPLUNK_SOURCETYPE:-mcp:demo:event}
      SPLUNK_SCENARIO_ID: ${SPLUNK_SCENARIO_ID:-checkout-degradation-v1}
      SPLUNK_REST_VERIFY_SSL: ${SPLUNK_REST_VERIFY_SSL:-true}
      SPLUNK_HEC_VERIFY_SSL: ${SPLUNK_HEC_VERIFY_SSL:-true}
      SPLUNK_SEARCH_TIMEOUT_SECONDS: ${SPLUNK_SEARCH_TIMEOUT_SECONDS:-60}
      SPLUNK_INDEX_WAIT_SECONDS: ${SPLUNK_INDEX_WAIT_SECONDS:-30}
      SPLUNK_HEC_BATCH_SIZE: ${SPLUNK_HEC_BATCH_SIZE:-200}
      CATALOG_MCP_PORT: ${CATALOG_MCP_PORT:-8103}
      SPLUNK_REST_CA_BUNDLE: ${SPLUNK_REST_CA_BUNDLE:-}
      SPLUNK_HEC_CA_BUNDLE: ${SPLUNK_HEC_CA_BUNDLE:-}
      DEMO_SPLUNK_CONFIG_PATH: /app/config/splunk-connection.enc
      DEMO_SPLUNK_CONFIG_KEY_PATH: /app/config/.splunk-connection.key
    volumes:
      - demo-data:/app/data
      - demo-settings:/app/config

volumes:
  demo-data:
  demo-settings:
